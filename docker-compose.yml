# Novel Web Publisher 部署编排
#
# 用法:
#   docker compose up -d                # 启动全部服务(web + scheduler)
#   docker compose exec web sh          # 进入 web 容器
#   docker compose exec web npm run import:novel -- /app/novels/星海余烬   # 导入小说
#   docker compose logs -f scheduler    # 查看调度器日志
#
services:
  web:
    build:
      context: .
      # 本地 Kokoro TTS 开关:由 rebuild.sh(默认 --build-arg ENABLE_LOCAL_TTS=1)或
      # `docker compose build --build-arg ENABLE_LOCAL_TTS=1` 控制;=1 时镜像内置
      # kokoro-js-zh(中文)+ onnxruntime-node(听书「本地语音」引擎)。
      # ⚠ 不要在这里写死 ENABLE_LOCAL_TTS:compose 文件的 args 优先于命令行
      # --build-arg,写死 "0" 会让 rebuild.sh 的启用参数被覆盖,线上无「本地语音」选项。
      # 模型权重不进镜像,由下方 ./models/kokoro 卷挂载;未挂载模型时自动回退 Edge 在线合成。
    container_name: novel-web
    restart: unless-stopped
    ports:
      - "33000:33000"
    # 内存调优(低配 1.8G 主机):限制容器上限,防止单容器吃满触发系统级 swap 换页风暴。
    # next-server 正常 RSS ~1GB(其中 V8 堆约一半),给 kokoro 模型推理留余量。
    mem_limit: 1500m
    environment:
      NODE_ENV: production
      NOVEL_DATA_DIR: /app/data
      NOVEL_SITE_URL: http://localhost:33000   # 部署后改为实际域名
      PORT: "33000"
      TZ: Asia/Shanghai                        # 容器日志/本地时间按北京时间
      EDGE_TTS_PROXY: ""                       # AI 朗读出口代理(可选):服务器无法直连 bing 时填 http://user:pass@host:port
      KOKORO_MODEL_DIR: /app/models/kokoro     # 本地语音模型目录(卷挂载,存在 .onnx 才启用)
      # 内存调优:限制 V8 老生代堆上限。Node 默认堆 ≈ 物理内存一半,GC 惰性,
      # next-server RSS 会膨胀到 ~1GB 挤爆 1.8G 主机 → 全系统 swap 换页风暴
      # (kokoro CPU 推理 100 字 176s 的元凶)。限 768MB 强制 GC 更积极。
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - ./data:/app/data                                          # SQLite 数据库
      - ./web/public/covers:/app/web/public/covers               # 封面
      - ./novels:/app/novels:ro                                   # 小说源(导入时读取)
      # 本地 Kokoro 模型:从 HuggingFace 下载 onnx-community/Kokoro-82M-v1.0-ONNX 的
      # model.onnx/q8 权重放入 ./models/kokoro 即可启用「本地语音」(挂载空目录=未启用)
      - ./models/kokoro:/app/models/kokoro:ro

  # 常驻调度器:每日自动连载 + 定时发布
  scheduler:
    build: .
    container_name: novel-scheduler
    restart: unless-stopped
    # 调度循环 tick 间隔可达 60s,优雅停机(释放锁)需要足够窗口,
    # 否则超出宽限期被 SIGKILL 后锁残留
    stop_grace_period: 90s
    # 调度器常驻循环,内存需求小,设上限防止异常膨胀
    mem_limit: 256m
    # 不暴露端口,仅访问共享 data
    environment:
      NODE_ENV: production
      NOVEL_DATA_DIR: /app/data
      PUBLISH_TICK_SECONDS: "60"
      TZ: Asia/Shanghai                        # 每日连载时刻按北京时间解释
    volumes:
      - ./data:/app/data                                          # 与 web 共享同一份 SQLite 数据库
    command: ["npx", "tsx", "scripts/publish-scheduler.ts"]
